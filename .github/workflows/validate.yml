name: validate

on:
  push:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate skills
        run: python3 scripts/validate_skills.py
      - name: Validate template
        run: python3 scripts/validate_skills.py --skills-path templates --allow-template-placeholders
      - name: Check skill maps
        run: python3 scripts/skill_graph.py --check
      - name: Check the seam inventory
        run: python3 scripts/seam_contract.py --check
      - name: Test validation scripts
        run: PYTHONPATH=scripts python3 -m unittest discover -s scripts/tests -v
      - name: Check Python style
        run: |
          pip install ruff==0.16.1
          ruff check .
      - name: Check the non-Python sources parse
        run: |
          node --input-type=module --check < .opencode/plugins/fornax.js
          bash -n .githooks/pre-commit
      - name: Install deployment engine
        run: pip install "agent-skill-deployer @ git+https://github.com/tacticaldoll/agent-skill-deployer.git@v0.1.1"
      - name: Test deployment CLI
        run: PYTHONPATH=tools/fornax-cli python3 -m unittest discover -s tools/fornax-cli/tests -v
