name: validate

on:
  push:
  workflow_dispatch:

jobs:
  python-38:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: Check workspace on the minimum maintenance runtime
        run: python3 scripts/check_workspace.py

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check workspace
        run: python3 scripts/check_workspace.py
      - name: Check Python style
        run: |
          pip install ruff==0.16.1
          ruff check .
      - name: Check the non-Python sources parse
        run: |
          node --input-type=module --check < .opencode/plugins/fornax.js
          bash -n .githooks/pre-commit
      - name: Install deployment engine
        run: pip install "agent-skill-deployer @ git+https://github.com/tacticaldoll/agent-skill-deployer.git@v0.1.2"
      - name: Test deployment CLI
        run: PYTHONPATH=tools/fornax-cli python3 -m unittest discover -s tools/fornax-cli/tests -v
