schema: 1
knowns:
  - id: independently-runnable-link-checks
    statement: Component checks retain overlapping absolute Markdown link validation.
    kind: constraint
    treatment: accept
    rationale: validate_skills.py and check_text.py are independently runnable checks with different scopes and diagnostics.
    evidence:
      - scripts/validate_skills.py validates links inside each production skill.
      - scripts/check_text.py validates Markdown links across the workspace.
    declined-changes:
      - Remove either component's absolute-link check solely to eliminate overlap in check_workspace.py.
    reconsider-when: The component checks stop being public independently runnable entry points.
    updated: 2026-08-18
  - id: partial-review-requires-relevant-gate
    statement: Silence closes a carried review item only when the current review opened the gate relevant to that item.
    kind: constraint
    treatment: accept
    rationale: Enumerating coverage labels alone cannot distinguish a relevant partial review from an unrelated one.
    evidence:
      - skills/triage-findings/SKILL.md requires the relevant gate for partially-gate-reviewed units.
      - scripts/tests/test_review_contract.py asserts the relevant-gate relationship directly.
    declined-changes:
      - Replace the semantic relationship assertion with a check that only enumerates coverage labels.
    reconsider-when: Review coverage gains a structural representation that encodes item-to-gate relevance.
    updated: 2026-08-18
  - id: seam-inventory-repeats-shape-per-consumer
    statement: Record seam inventory intentionally repeats a producer's record shape for each consumer seam.
    kind: constraint
    treatment: accept
    rationale: The inventory unit is an exact producer-to-consumer seam, and each block remains mechanically derived from its declarations.
    evidence:
      - scripts/seam_contract.py renders each discovered producer and consumer pair as one block.
      - docs/review-record-contract.md describes the generated output as a seam list.
    declined-changes:
      - Group consumers under one record block solely to deduplicate identical producer element tables.
    reconsider-when: Repetition materially impairs review or the inventory changes from seam-oriented to record-oriented.
    updated: 2026-08-18
