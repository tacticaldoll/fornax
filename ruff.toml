# Style gate for the repository's Python, checked in CI and never auto-applied:
# see the Testing Strategy section of AGENTS.md.
#
# 100 is the width the Python and the markdown already use, with one exemption that is
# ruff's and not this file's: E501 does not report a line whose content after the
# indentation holds no whitespace. Measured with a matched pair at 106 characters — the
# one carrying a single interior space is reported, the one carrying none is not — so a
# long unbreakable token is exempt however long it is. A 103-character assertion stood
# in the tree under a green gate because of it. Registered as
# `e501-exempts-a-whitespace-free-line`; the width above is the claim, and this is the
# part of it the tool does not hold.
#
# `preview` is on because the pycodestyle whitespace rules sit behind it, and a
# missing space around an assignment operator is the exact defect that reached
# main with every other gate passing — the reason this file exists. Preview
# rules move between ruff releases, which is why CI pins one version; bumping it
# is a deliberate act that may surface new findings.
#
# E, F and W, plus rules about the suppression mechanism itself. Ruff's own
# default selection here also reports shebang permissions, import sorting and `with`
# nesting — opinions this repository never adopted, and ones that would have required
# editing the pinned CLI adapter just to land the gate.
#
# PGH004 and RUF100 are here because a malformed directive silently disabled every
# rule on its line and nothing failed. `# noqa: F401  (prose)` puts non-code text where
# ruff expects codes, so ruff falls back to a blanket suppression and emits a warning —
# and a warning does not fail `ruff check`. The line was 103 characters with E501
# enabled, and E501 did not fire; a 116-character probe confirmed E501 was live.
#
# Neither rule closes that case, which was measured rather than assumed. PGH004 catches
# a bare `# noqa` with no codes at all; RUF100 catches a directive suppressing nothing.
# The malformed-suffix form passes both. They are here because they are the closest
# available guard and cost nothing on what the tree holds — not because the hole is
# closed. Closing it needs the warning to fail the run, which this pinned ruff has no
# setting for.
#
# This said no `# noqa` exists in the tree, and the pinned CLI adapter carries two of
# them for E402, on imports that follow a path insertion. They are well formed, so
# neither rule fires and the "cost nothing" half holds; what was false is the claim that
# there is nothing here to get this wrong. Appending prose after those codes is exactly
# the malformed form above, and it would go silent.

# Keep aligned mechanically with .python-version through scripts/runtime_contract.py.
target-version = "py310"
line-length = 100

[lint]
preview = true
select = ["E", "F", "W", "PGH004", "RUF100"]
