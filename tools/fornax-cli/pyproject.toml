[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fornax-cli"
dynamic = ["version"]
description = "Deploy the Fornax workspace across supported local agent hosts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "tacticaldoll" }]
dependencies = [
  "agent-skill-deployer @ git+https://github.com/tacticaldoll/agent-skill-deployer.git@v0.1.2",
  # Nothing under fornax_cli/ imports these. Snapshot validation shells out to
  # scripts/validate_skills.py, which parses Markdown links, so the interpreter
  # running fornax must be able to import them. Pinned to the same versions as
  # requirements-maintenance.txt — a deployment tool that validates one pinned tag
  # should not validate it with a different library each run — and a test asserts
  # the two declarations agree.
  "markdown-it-py==4.2.0",
  "mdurl==0.1.2",
]

[project.scripts]
fornax = "fornax_cli.cli:main"

[tool.hatch.version]
source = "regex"
path = "../../distribution.json"
pattern = '"version"\s*:\s*"(?P<version>[^"]+)"'

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["fornax_cli"]
